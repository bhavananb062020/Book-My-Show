apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-app
  labels:
    app: bms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bms
  template:
    metadata:
      labels:
        app: bms
    spec:
      containers:
      - name: bms-container
        image: 571996362633.dkr.ecr.ap-south-1.amazonaws.com/bms:latest
        # image: bhavananb062020/bms:latest  # Replace with your Docker image(dockerhub))
        ports:
        - containerPort: 80  # Replace with the port your app runs on
